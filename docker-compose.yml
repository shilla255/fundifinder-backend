services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fundi
      POSTGRES_PASSWORD: fundi
      POSTGRES_DB: fundifinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundi -d fundifinder"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Development server with live code reload. Windows: needs Docker Desktop only.
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgis://fundi:fundi@db:5432/fundifinder
      # "*" in development so the Android emulator (10.0.2.2) and phones on your Wi-Fi can connect.
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
